name: deploy-site
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'   # 06:00 IST daily, so "Revise today" rolls over even without a merge
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}   # merge dates come from git history
      - uses: actions/setup-python@v7
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v6
      - run: python scripts/build_site.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with: {path: build/site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
