name: ci
# Required checks (ruleset): completeness, lint, site-build.
# No paths: filter on purpose — a required check that never runs blocks the merge.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: python scripts/check_completeness.py
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: yamllint -s syllabus data .github
      - run: python scripts/lint.py --base ${{ github.event.pull_request.base.sha }}
      - run: python -m pytest -q tests

  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: python scripts/build_site.py
      - run: zensical build --clean
